    <rect x="750" y="400" width="450" height="180" rx="2"/>
    <rect x="1250" y="400" width="570" height="180" rx="2"/>
    <rect x="100" y="650" width="400" height="200" rx="2"/>
    <rect x="550" y="650" width="350" height="200" rx="2"/>
    <rect x="950" y="650" width="300" height="200" rx="2"/>
    <rect x="1300" y="650" width="520" height="200" rx="2"/>
  </g>
  <g stroke="#E5E7EB" stroke-width="1" opacity="0.3">
    <line x1="100" y1="100" x2="400" y2="300"/>
    <line x1="500" y1="100" x2="900" y2="300"/>
    <line x1="1000" y1="100" x2="1350" y2="300"/>
    <line x1="1450" y1="100" x2="1820" y2="300"/>
